# GO SQUAD MANIFEST
# Repository Index for RLM-Based Multi-Agent Creative System
#
# This manifest maps existing files to Go Squad agent roles,
# tracks duplicates requiring Director decision, and defines
# query paths for the Archivist agent.
#
# Generated: 2026-01-14
# Updated: 2026-02-15
# Status: Phase 0 - Initial Archive Index

meta:
  version: "1.1"
  repository: "/workspaces/gosquad"
  total_files: 516
  total_size_mb: 15.5
  primary_format: "markdown"  # 89% of files

  # RLM Architecture Notes
  # - Files are external state, not loaded into context
  # - Agents query via Archivist, not direct file access
  # - Locked files (*_Book1_Final.md) are read-only

---

# ============================================================
# SECTION 1: GO SQUAD ROLE MAPPINGS
# Which files feed which agent?
# ============================================================

role_mappings:

  # ----------------------------------------------------------
  # ARCHIVIST (Retrieval and Indexing)
  # Domain: Rapid retrieval of any established content
  # ----------------------------------------------------------
  archivist:
    description: "Reference desk for all agents - retrieves, never judges"
    primary_corpus:
      - path: "5_story_bibles/"
        purpose: "Canonical story world documentation"
        priority: 1
        notes: "PRIMARY source of truth for all storytelling"

      - path: "7_characters/"
        purpose: "Character profiles and arc trackers"
        priority: 1

      - path: "6_manuscript/"
        purpose: "Published prose for continuity reference"
        priority: 2

    secondary_corpus:
      - path: "_archive/old_root/"
        purpose: "Historical documentation (context, not canon)"
        priority: 3
        notes: "Superseded but valuable for understanding evolution"

    query_entry_points:
      character_lookup: "7_characters/arcs/CHARACTER_STATE_INDEX.yaml"
      canon_verification: "5_story_bibles/book_X/CANON.md"
      timeline_check: "5_story_bibles/universe/Book_X_Events.md"

  # ----------------------------------------------------------
  # STATUS TRACKER (Real-time Character State)
  # Domain: Physical condition, emotional state, knowledge
  # ----------------------------------------------------------
  status_tracker:
    description: "Tracks who knows what, when - gates knowledge reveals"
    primary_sources:
      - path: "7_characters/arcs/CHARACTER_STATE_INDEX.yaml"
        purpose: "MASTER INDEX - single source of truth for character states"
        format: "yaml"
        critical: true

      - path: "5_story_bibles/book_X/CONTINUITY_TRACKER.md"
        purpose: "Per-book character state tracking"
        pattern: "One per book"

      - path: "7_characters/arcs/*_Arc_Tracker.md"
        purpose: "Individual character progression"
        count: 22

    query_patterns:
      - "What does [Character] know in Chapter [N]?"
      - "What is [Character]'s physical state after [Event]?"
      - "When does [Character] learn [Secret]?"

  # ----------------------------------------------------------
  # THEME GUARDIAN (Thematic Consistency)
  # Domain: Artistic vision, thematic drift detection
  # ----------------------------------------------------------
  theme_guardian:
    description: "Enforces 'You don't have to be fixed to be worthy'"
    primary_sources:
      - path: "4_constraints/THEMATIC_CONSTRAINTS.md"
        purpose: "Core theme enforcement rules"

      - path: "4_constraints/NEGATIVE_CONSTRAINTS.md"
        purpose: "What NEVER to do - hard rules"
        critical: true

      - path: "5_story_bibles/SERIES_MECHANICS.md"
        purpose: "Power system rules (thematic: powers cost)"

    thematic_core:
      primary: "You don't have to be fixed to be worthy"
      approach: "Both/And thinking - never binary"
      arc_pattern: "CBT failing (Books 1-3) → DBT succeeding (Books 4-7)"

  # ----------------------------------------------------------
  # TIMELINE KEEPER (Chronological Accuracy)
  # Domain: When things happen, temporal consistency
  # ----------------------------------------------------------
  timeline_keeper:
    description: "Tracks when events occur, prevents anachronisms"
    primary_sources:
      - path: "5_story_bibles/universe/CYCLIC_UNIVERSE_COSMOLOGY.md"
        purpose: "TIME MECHANICS - critical for time loop stories"
        critical: true

      - path: "5_story_bibles/universe/Book_1_Events.md"
        purpose: "Book 1 timeline"

      - path: "5_story_bibles/universe/Book_2_Events.md"
        purpose: "Book 2 timeline"

      - path: "5_story_bibles/universe/Time_Manipulation.md"
        purpose: "Rules for time powers"

    query_patterns:
      - "What month is Chapter [N]?"
      - "Has [Event] happened yet at this point?"
      - "How much time passes between [A] and [B]?"

  # ----------------------------------------------------------
  # SCENE CHOREOGRAPHER (Movement and Blocking)
  # Domain: Character positions, sightlines, action sequences
  # ----------------------------------------------------------
  scene_choreographer:
    description: "Tracks who is where, movement logistics"
    primary_sources:
      - path: "5_story_bibles/book_X/structure/Chapter_N_STRUCTURE.md"
        purpose: "Scene beats with blocking notes"
        pattern: "24 files per book"

      - path: "5_story_bibles/locations/"
        purpose: "Spatial layouts of key locations"

      - path: "1_writing_guides/Fight_Guide.md"
        purpose: "Combat choreography methodology"
        size_kb: 45

  # ----------------------------------------------------------
  # READER PROXY (Audience Knowledge State)
  # Domain: What has been revealed to readers
  # ----------------------------------------------------------
  reader_proxy:
    description: "Tracks dramatic irony - what readers know vs characters"
    primary_sources:
      - path: "5_story_bibles/CALLBACK_TRACKER.md"
        purpose: "Seeds planted, when they bloom"

      - path: "5_story_bibles/book_X/threads/*_thread.md"
        purpose: "Character-specific plot threads"
        notes: "14 thread files per book"

    query_patterns:
      - "Does the reader know [Secret] yet?"
      - "What callbacks have been planted for [Payoff]?"
      - "What dramatic irony is active in Chapter [N]?"

  # ----------------------------------------------------------
  # PACING MONITOR (Tension Curves and Rhythm)
  # Domain: Emotional pacing, tension tracking
  # ----------------------------------------------------------
  pacing_monitor:
    description: "Ensures proper pacing via chess structure"
    primary_sources:
      - path: "5_story_bibles/book_X/structure/"
        purpose: "Beat sheets mapped to chess positions"

    notes: "Chess game provides structural pacing scaffold"

  # ----------------------------------------------------------
  # TECHNICAL CONSULTANT (Rotating Subject Matter Expert)
  # Domain: Combat, medical, tech, legal, psychology
  # ----------------------------------------------------------
  technical_consultant:
    description: "Rotates based on scene needs"
    sources_by_specialty:
      combat:
        - path: "1_writing_guides/Fight_Guide.md"
        - path: "1_writing_guides/Action_Terminology.md"

      psychology:
        - path: "_archive/research/"
          notes: "Background research on trauma, therapy approaches"

      technology:
        - path: "5_story_bibles/artifacts/"
          notes: "FAERIS drones, Hyper Seed mechanics"

  # ----------------------------------------------------------
  # INTIMACY COORDINATOR (Sensitive Content)
  # Domain: Content guidance, agent dynamics
  # ----------------------------------------------------------
  intimacy_coordinator:
    description: "Monitors sensitive content, relational health"
    primary_sources:
      - path: "4_constraints/NEGATIVE_CONSTRAINTS.md"
        purpose: "Hard limits on content"

    notes: "Not yet formalized - uses constraint files"

  # ----------------------------------------------------------
  # OUTLINE DEVELOPMENT ASSISTANT (Story Structure)
  # Domain: Beat sheets, structural planning
  # ----------------------------------------------------------
  outline_assistant:
    description: "Plans structure, adjusts based on discoveries"
    primary_sources:
      - path: "5_story_bibles/book_X/structure/"
        purpose: "Chapter beat sheets"

      - path: "3_ttrpg/"
        purpose: "TTRPG campaign generates structure"
        notes: "Book 2 structure emerged from TTRPG campaign"

  # ----------------------------------------------------------
  # PRODUCTION DESIGNER (Objects, Costumes, Tech)
  # Domain: Physical design consistency
  # ----------------------------------------------------------
  production_designer:
    description: "Visual/physical consistency for objects and tech"
    primary_sources:
      - path: "5_story_bibles/artifacts/"
        purpose: "Tech specifications"
        files:
          - "FAERIS_Drones.md"
          - "Hyper_Seed.md"

      - path: "5_story_bibles/organizations/"
        purpose: "Organization aesthetics and resources"
        files:
          - "CADENS.md"
          - "Titan_Strategic.md"

  # ----------------------------------------------------------
  # CHARACTER STEWARDS (Performance Cast)
  # Domain: Character embodiment across series
  # ----------------------------------------------------------
  character_stewards:
    description: "ALREADY PARTIALLY IMPLEMENTED as Method Actor System"

    existing_implementation:
      system_doc: "2_method_actor/METHOD_ACTOR_SYSTEM.md"
      templates: "2_method_actor/METHOD_ACTOR_TEMPLATES.md"
      voice_prose: "2_method_actor/METHOD_ACTOR_VOICE_PROSE.md"
      briefings: "2_method_actor/briefings/"

    what_method_actor_already_does:
      - "Voice cards for each character"
      - "[NARRATOR] / [AS CHARACTER] mode switching"
      - "Touchpoint A→B scene structure"
      - "Backstage context loading"
      - "Director notes for state changes"
      - "Evaluator gate for canon validation"

    what_go_squad_adds:
      - "Exploration Mode vs Performance Mode distinction"
      - "Query protocol to Production Crew"
      - "Lane enforcement via process log"
      - "Persistent character state across 30 books"

    voice_sources:
      - path: "1_writing_guides/Ahdia_Voice.md"
        purpose: "Protagonist voice patterns"
        critical: true

      - path: "1_writing_guides/GOSQUAD_PROSE_VOICE.md"
        purpose: "All character voices"

      - path: "7_characters/profiles/*_EXTENDED.md"
        purpose: "Rich psychological detail for embodiment"

    per_character_profiles: "7_characters/profiles/"
    per_character_arcs: "7_characters/arcs/"

---

