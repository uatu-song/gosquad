      - "python prose_indexer.py slop --book 2"
      - "python prose_indexer.py ingest --book 2"

  knowledge_loaders:
    description: "Load series context for AI assistants"
    files:
      - "gosquad_knowledge_loader.py"
      - "gosquad_knowledge_loader_advanced.py"

