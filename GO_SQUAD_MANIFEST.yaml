# ============================================================
# SECTION 7: RECOMMENDED QUERY PATTERNS
# How agents should request information
# ============================================================

query_patterns:

  # Pattern 1: Character state at point in story
  character_state:
    question: "What does [Character] know in Chapter [N] of Book [X]?"
    query_chain:
      1: "7_characters/arcs/CHARACTER_STATE_INDEX.yaml → character entry"
      2: "7_characters/arcs/[Character]_Arc_Tracker.md → chapter state"
      3: "5_story_bibles/book_X/CONTINUITY_TRACKER.md → verify"
    returns: "Knowledge list, emotional state, physical state"

  # Pattern 2: Scene beats
  scene_beats:
    question: "What are the beats for Chapter [N], Scene [M]?"
    query_chain:
      1: "5_story_bibles/book_X/structure/Chapter_N_STRUCTURE.md"
    returns: "Touchpoint A, Touchpoint B, requirements, constraints"

  # Pattern 3: Character voice
  character_voice:
    question: "How does [Character] speak?"
    query_chain:
      1: "1_writing_guides/GOSQUAD_PROSE_VOICE.md → character section"
      2: "7_characters/profiles/[Character]_EXTENDED.md → dialogue patterns"
      3: "2_method_actor/briefings/ → if exists for this scene"
    returns: "Voice patterns, forbidden phrases, example dialogue"

  # Pattern 4: Canon verification
  canon_check:
    question: "Did [Event] happen? When? Who was involved?"
    query_chain:
      1: "5_story_bibles/book_X/CANON.md"
      2: "5_story_bibles/universe/Book_X_Events.md"
      3: "7_characters/arcs/CHARACTER_STATE_INDEX.yaml → affected characters"
    returns: "Canonical truth, timeline position, participants"

  # Pattern 5: Constraint validation
  constraint_check:
    question: "Is [proposed content] allowed?"
    query_chain:
      1: "4_constraints/NEGATIVE_CONSTRAINTS.md → forbidden patterns"
      2: "5_story_bibles/SERIES_MECHANICS.md → power rules"
      3: "4_constraints/THEMATIC_CONSTRAINTS.md → thematic alignment"
    returns: "ALLOWED / BLOCKED / FLAGGED with reason"

