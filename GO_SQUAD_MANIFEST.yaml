      locks: "Ahdia's state at end of Book 1"

    - path: "7_characters/profiles/Ruth_Carter_Book1_Final.md"
      locks: "Ruth's state at end of Book 1"

    - path: "7_characters/profiles/Harding_Kain_Book1_Final.md"
      locks: "Kain's state at end of Book 1"

    - path: "7_characters/profiles/Firas_Bacchus_Book1_Final.md"
      locks: "Firas's state at death (Book 1)"

    - path: "7_characters/profiles/The_Go_Squad_Book1_Final.md"
