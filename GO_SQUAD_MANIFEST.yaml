# ============================================================
# SECTION 4: DEPENDENCY MAP (Query Paths)
# What references what - critical for Archivist routing
# ============================================================

dependency_map:

  # Character query chain
  character_query:
    entry_point: "7_characters/arcs/CHARACTER_STATE_INDEX.yaml"
    flows_to:
      - "7_characters/arcs/[Character]_Arc_Tracker.md"
      - "7_characters/profiles/[Character].md"
      - "7_characters/profiles/[Character]_EXTENDED.md"
      - "5_story_bibles/book_X/threads/[Character]_thread.md"
    locked_reference: "7_characters/profiles/[Character]_Book1_Final.md"

  # Continuity query chain
  continuity_query:
    entry_point: "5_story_bibles/book_X/CANON.md"
    flows_to:
      - "5_story_bibles/book_X/CONTINUITY_TRACKER.md"
      - "5_story_bibles/universe/Book_X_Events.md"
      - "7_characters/arcs/CHARACTER_STATE_INDEX.yaml"

  # Scene generation chain
  scene_generation:
    entry_point: "5_story_bibles/book_X/structure/Chapter_N_STRUCTURE.md"
    requires:
      - "2_method_actor/METHOD_ACTOR_SYSTEM.md"
      - "1_writing_guides/GOSQUAD_PROSE_VOICE.md"
      - "4_constraints/NEGATIVE_CONSTRAINTS.md"
    produces: "6_manuscript/book_X/chapter_N.md"
    validated_by: "4_constraints/evaluator_spec.md"

  # Constraint enforcement chain
  constraint_check:
    entry_point: "4_constraints/NEGATIVE_CONSTRAINTS.md"
    cross_references:
      - "5_story_bibles/SERIES_MECHANICS.md"
      - "4_constraints/THEMATIC_CONSTRAINTS.md"
    validation_spec: "4_constraints/evaluator_spec.md"

