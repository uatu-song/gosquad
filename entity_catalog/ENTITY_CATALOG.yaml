# ============================================================================
# META: VALIDATION QUERIES
# ============================================================================

validation_queries:

  check_victor_wife:
    description: "Ensure Victor has no wife references"
    patterns:
      - "Victor" + ("wife" | "widow" | "Clara" | "married")
    severity: "BLOCKING"

  check_sarah_death:
    description: "Ensure Sarah's death cause not specified"
    patterns:
      - "Sarah" + ("protest" | "riot" | "demonstration" | "killed by")
    severity: "BLOCKING"

  check_tess_discovery:
    description: "Ensure Tess doesn't 'discover' father corruption"
    patterns:
      - "Tess" + ("discovers" | "learns" | "realizes") + "father" + "corrupt"
    severity: "BLOCKING"

  check_bourn_gender:
    description: "Ensure Bourn uses she/her pronouns"
    patterns:
      - "Bourn" + ("he" | "him" | "his")
    severity: "BLOCKING"

  check_webb_survives:
    description: "Ensure Webb is not killed"
    patterns:
      - ("Tess" + "kills" + "Webb") | ("Webb" + "dead")
    severity: "BLOCKING"

  check_ryu_confession:
    description: "Ensure Ryu doesn't confess love"
    patterns:
      - "Ryu" + ("confess" | "declare") + "love"
    severity: "BLOCKING"

  check_eidolon_creates:
    description: "Ensure Eidolon doesn't create fear"
    patterns:
      - "Eidolon" + "creates" + "fear"
    severity: "BLOCKING"

  check_company_name:
    description: "Ensure TRIOMF not called Titan Strategic"
    patterns:
      - "Titan Strategic"
    severity: "BLOCKING"
