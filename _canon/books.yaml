# ─────────────────────────────────────────────────────────────────────────────
# HOUSE TYPOGRAPHY
# ─────────────────────────────────────────────────────────────────────────────
# MEASURED 2026-07-26 across all 23 Book 2 quarry chapters (47,271 words) — the
# values below DESCRIBE that prose; they are not yet a Director-ruled standard.
# The old draft is self-consistent:
#     4,140 straight "      vs      0 curly “”
#     2,190 straight '      vs      0 curly ’
#       438 closed em—dash  vs      0 spaced em — dash
#        87 collapsed ...   vs      0 spaced . . .  and 0 … glyphs
# Only true drift: 4 stray `**bold**` in ch21/ch23 (markdown residue).
#
# `enforce` stays FALSE until the Director rules the house style for the
# rebuild era (note: em-dashes.md shows a recent authorial push AWAY from
# em-dash overuse — the ruling may differ from the measured legacy style).
# A noisy gate is an ignored gate; this one only becomes a wall when ruled.
typography:
  enforce: false
  house:
    double_quote: straight        # straight | curly
    apostrophe: straight          # straight | curly
    em_dash: closed               # closed (a—b) | spaced (a — b)
    ellipsis: collapsed           # collapsed (...) | spaced (. . .) | char (…)
  # Forms that are wrong under ANY house style — markdown/import residue.
  always_banned:
    - stray_bold
    - underscore_italics
