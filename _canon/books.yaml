# ─────────────────────────────────────────────────────────────────────────────
# BOOK REGISTRY — THE CANONICAL NUMBERING AUTHORITY + path source of truth.
#
# Director ruling 2026-07-26: the series is 8 books, numbered 1–8, sequential
# integers, NO LETTER SUFFIXES, EVER. "2A"/"2B"/"3A"/"3B" are dead labels. If a
# book earns a split during generation, it takes two numbers at that point and
# downstream books renumber. Splits are not pre-locked; they must emerge.
# Legacy-label translation: /LEGACY_NUMBERING.md.
#
# Every tool in _canon/tools/ reads paths from here via bookconfig.py. No tool
# contains a literal path. Resolution order:  --book flag  >  $BOOK  >  default_book
# ─────────────────────────────────────────────────────────────────────────────
default_book: book_1

books:

  book_1:
    title: "Book 1 — Avoidance → Forced Action"
    status: rebuild-preprose
    # Rebuild at step 9 (cinematic blocking); prose is step 10 and hasn't
    # started. No manuscript glob match is CORRECT — the codex gets tagged as
    # prose is written (the forward case; safer than retroactive ingest).
    # NOT canon: 6_manuscript/book_1/book1_manuscript.txt — PDF extraction of
    # the pre-rebuild draft (318 embedded headers, 418 broken words). Quarry.
    manuscript_dir: 6_manuscript/book_1/chapters
    chapter_glob: "chapter_*.md"
    chapter_num_re: 'chapter_(\d+)'
    data_dir: canon/book_1
    prose_expected: false

  book_2:
    title: "Book 2 — Sacrifice → Vulnerability"   # legacy label: "2A"
    status: quarry            # old prose exists but is NOT edit-of-record;
                              # the book is slated for regeneration through the
                              # emergent pipeline after Book 1.
    # chapters_split/ is the cleanest structured copy of the old draft (23
    # files, `# Chapter N` headers + provenance comments). Registered so the
    # engine can grep it as QUARRY — not so it can be treated as canon.
    manuscript_dir: 6_manuscript/book_2/chapters_split
    chapter_glob: "chapter_*.txt"
    chapter_num_re: 'chapter_(\d+)'
    data_dir: canon/book_2
    prose_expected: true

  book_3:
    title: "Book 3 — Go Squad vs TRIOMF (Qe3#)"   # legacy label: "2B"
    status: pre-prose         # steward Run 1 complete (outline beats only)
    manuscript_dir: 6_manuscript/book_3
