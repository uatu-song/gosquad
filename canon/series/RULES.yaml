# ─────────────────────────────────────────────────────────────────────────────
# SERIES-WIDE RULES — apply to EVERY registered book's prose.
# Book-local canon/book_N/RULES.yaml overrides a series rule with the same id.
#
# FRESH-CUT 2026-07-26 from the repo's own measured tic inventory. Sources:
#   - PROSE_VOICE_DESIGN_PROBLEM.md audit tables (2026-04-03 cross-book audit)
#   - 1_writing_guides/Ahdia_Voice.md Part 4B "Generation Artifacts to Avoid"
#   - 4_constraints/NEGATIVE_CONSTRAINTS.md (scent-opener ban → census tool,
#     since "first line of chapter" is positional and lives there instead)
#
# SEVERITY IS SCOPED, NOT UNIFORM (Director, 2026-07-26). The same rule means
# different things against quarry and against new prose:
#   `severity: warning`      — what the audit applies to QUARRY (pre-rule text).
#   `severity_new: blocking` — what the REWRITE GATES apply to a generated
#                              draft. A pure-AI marker (R103/R104: measured at
#                              INFINITE escalation, i.e. zero instances in the
#                              author's own chapters) is an error in new prose
#                              even though it is only a warning in the old.
# Quarry must never block a commit; new prose must never ship with a marker the
# author has never once used. When the rebuild prose starts, the Director may promote specific rules
# to `blocking` for the new prose (book-local override in canon/book_1/RULES.yaml).
#
# Rate-based tics (fragments, "still"/"already"/"just" frequency, em-dash
# density) cannot be line-regex rules — they live in tools/tic_census.py.
# ─────────────────────────────────────────────────────────────────────────────

codex_meta:
  scope: series
  codex_version: 1

rules:

  R100_the_particular:
    statement: >
      "The particular [noun] of" — Book 2's signature AI mutation (48 instances
      measured, across every POV). The amplification mechanism's clearest
      fingerprint; near-zero in the author's pre-AI prose.
    severity: warning
    severity_new: blocking
    owner: Director
    source_doc: PROSE_VOICE_DESIGN_PROBLEM.md
    forbidden_in_prose:
      - pattern: '\bthe particular\b'
        note: "AI-default construction — Book 2's signature tic"

  R101_not_construction:
    statement: >
      The formulaic-negation family — "not X, but Y" / "It wasn't X. It was Y."
      / "Not X. Not Y." / "Didn't X. Didn't Y." / "no X, no Y" — the rhetorical
      tic of an AI reaching for profundity. 113 counted in Book 1's first
      edition by the 2026-04 audit (Ch1-11: only 4; Ch29 alone: 10); the
      2026-07-26 ferret pass measured the full family at 58 (B1) / 65 (B2),
      with "Didn't X. Didn't Y." a LATE-stage mutation (B1: appears only Ch23+;
      B2 Ch08: five in one chapter).
    severity: warning
    owner: Director
    source_doc: PROSE_VOICE_DESIGN_PROBLEM.md + ferret pass 2026-07-26
    forbidden_in_prose:
      - pattern: '\b[Nn]ot [^.!?;]{1,36}, (?:but|just)\b'
        note: "not X, but/just Y"
      - pattern: "\\b(?:was|is|are|did|does)n't [^.!?;]{1,32}\\. It was\\b"
        note: "It wasn't X. It was Y."
      - pattern: '\b[Nn]ot [^.!?;]{1,30}\. Not \b'
        note: "Not X. Not Y. (anaphoric negation)"
      - pattern: "\\b[Dd]idn't [^.!?;]{1,30}\\. Didn't\\b"
        note: "Didn't X. Didn't Y. (late-stage mutation)"
      - pattern: '\b[Nn]o [^.!?;,]{1,20}, no [^.!?;,]{1,24}[,.]'
        note: "no X, no Y (list negation)"
      - pattern: "\\b(?:was|is)n't just\\b"
        note: "wasn't just X (implied escalation)"
      - pattern: '\bso much as\b'
        note: "didn't X so much as Y"

  R103_somatic_default:
    statement: >
      "in her/his chest" — the AI's default somatic location for emotion.
      Mined 2026-07-26: 23 uses in Book 1 ed1 + 18 in Book 2 (41 total, the
      single most repeated narration construction across both books).
    severity: warning
    severity_new: blocking      # infinite escalation: 0 uses in the author's own prose
    owner: Director
    source_doc: ferret pass 2026-07-26
    dialogue_exempt: true
    forbidden_in_prose:
      - pattern: '\bin (?:her|his|their) chest\b'
        note: "default emotion-location; vary the body or cut"

  R104_voice_described:
    statement: >
      "X's voice was [adj]" / "voice came out" — Book 2's staging mutation:
      emotion narrated by describing voices instead of embodying them. Mined
      2026-07-26: ~50 combined uses in Book 2 narration ("Ruth's voice" alone
      starts 26 sentences); rare in Book 1's clean half.
    severity: warning
    severity_new: blocking      # infinite escalation: 0 uses in the author's own prose
    owner: Director
    source_doc: ferret pass 2026-07-26
    dialogue_exempt: true
    forbidden_in_prose:
      - pattern: "\\b\\w+'s voice was\\b"
        note: "voice-description formula"
      - pattern: '\b[Hh](?:er|is) voice was\b'
        note: "voice-description formula"
      - pattern: '\bvoice came out\b'
        note: "voice-description formula"

  R102_hedge_construction:
    statement: >
      Hedge constructions — "a kind of", "a sort of", "something like",
      "almost as if". Named in Ahdia_Voice.md Part 4B (Generation Artifacts to
      Avoid): vagueness performing precision.
    severity: warning
    owner: Director
    source_doc: 1_writing_guides/Ahdia_Voice.md
    dialogue_exempt: true          # people hedge when they talk; narrators shouldn't
    forbidden_in_prose:
      - pattern: '\b[Aa] kind of\b'
        note: "hedge (Ahdia_Voice 4B)"
      - pattern: '\b[Aa] sort of\b'
        note: "hedge (Ahdia_Voice 4B)"
      - pattern: '\b[Ss]omething like\b'
        note: "hedge (Ahdia_Voice 4B)"
      - pattern: '\b[Aa]lmost as if\b'
        note: "hedge (Ahdia_Voice 4B)"
