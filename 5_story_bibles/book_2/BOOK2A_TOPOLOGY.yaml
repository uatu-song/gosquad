# ============================================================================
# VOICE SAMPLES (from prose — demonstrate, don't just describe)
# ============================================================================

voice_samples:
  ahdia_book2:
    description: "Depleted, evasive. Humor still present but engine idling."
    samples:
      - source: "ch7"
        quote: >
          "Plan? Ruth, I'm barely functioning. I get up, I watch TV, I try not to
          use my powers for anything because every second I freeze costs me something.
          I don't have a plan. I have a slow degradation curve and a lot of streaming services."
      - source: "ch17"
        quote: >
          "'Living the dream.' Ahdia's voice was flat. Not deadpan—depleted.
          The humor was there but the engine behind it was idling."
      - source: "ch8"
        quote: >
          "Like I've been watching TV for a week straight and forgot what sunlight
          looks like. So, normal."
  ruth_book2:
    description: "Boundary-setter. Clinical precision breaking under emotional weight."
    samples:
      - source: "ch17"
        quote: >
          "I won't provide treatment if you won't stop the secret missions...
          Every treatment I give you buys time you spend destroying yourself.
          I'm done being the reason you can keep going to places that are killing you."
      - source: "ch17"
        quote: >
          "Seventy-two hours. That's the minimum between treatments from now on.
          You coordinate with Ryu, you stay local, and you tell me the truth about
          where you've been. Those are the conditions."
  ben_book2:
    description: "Evidence-obsessed, military precision, institutional faith eroding."
    samples:
      - source: "ch12"
        quote: >
          "Enemy can coordinate multiple simultaneous operations. Four sites tonight.
          Same tactics, same timing, same professional gear. That's not random agitators.
          That's training. Resources. Command structure."
  victor_book2:
    description: "Both/And educator. Holds complexity without resolving it."
    samples:
      - source: "ch10"
        quote: >
          "'But' lets you collapse complexity into simple choice. 'And' forces you
          to stay in complexity without resolution."
      - source: "ch10"
        quote: >
          "You don't resolve it. You practice it. Gets easier with practice but
          never comfortable. Comfortable means you've collapsed complexity back
          to simple. Discomfort is sign you're still honoring both truths."
  tess_book2:
    description: "Controlled anger. Performing normalcy while everything burns."
    samples:
      - source: "ch5"
        quote: >
          "Don't. I know what you're going to say. 'Not your fault.' 'You're not him.'
          But it IS his department. He CHOSE to protect Webb."
      - source: "ch13"
        quote: >
          "He's my father. I'm using his name, his position to investigate him.
          It feels like betrayal. Of him. Of the badge I used to respect."
  prose_rules:
    source: "1_writing_guides/GOSQUAD_PROSE_VOICE.md + 1_writing_guides/Ahdia_Voice.md"
    key_rules:
      - "66% dialogue. 12-word average sentences. Fragments for impact."
      - "Density is a feature — every scene is load-bearing."
      - "Embody, don't articulate — characters live the theme, don't explain it."
      - "Voice trumps technical polish. When grammar and ear conflict, trust the ear."
      - "Ahdia's pop culture references are coping, not decoration. Max 2 simile-format per scene."
      - "Period-separated lists for staccato inventory. Not comma-separated."
      - "Em-dashes for mid-thought pivots. Commas for pauses."
      - "No thesis statements explaining what the scene showed."
      - "No softened dark statements ('dead parents' not 'parents who passed away')."

