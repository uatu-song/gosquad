        const chapters = [];

            const pos = (i - 0.5) / 2;
            let type = 'normal';
            if ([15, 19, 20].includes(i)) type = 'crisis';
            if ([23, 24].includes(i)) type = 'finale';
            chapters.push({ num: i, pos: pos, type: type });
        }

        function posToPercent(pos) {
            return (pos / 12) * 100;
        }

        function percentToPos(percent) {
            return (percent / 100) * 12;
        }

        function createChapterMarkers(timeline) {
            chapters.forEach(ch => {
                const marker = document.createElement('div');
                marker.className = 'chapter-marker' + (ch.type !== 'normal' ? ' ' + ch.type : '');
                marker.style.left = posToPercent(ch.pos) + '%';
                timeline.appendChild(marker);

                const label = document.createElement('div');
                label.className = 'chapter-label' + (ch.type !== 'normal' ? ' ' + ch.type : '');
                label.style.left = posToPercent(ch.pos) + '%';
                label.textContent = 'Ch ' + ch.num;
                timeline.appendChild(label);
            });

            const el = document.createElement('div');
            el.className = 'event';
            el.dataset.id = eventData.id;
            el.dataset.track = trackId;
            el.dataset.type = eventData.type || 'action';
            el.style.left = posToPercent(eventData.pos) + '%';

            const textSpan = document.createElement('span');
            textSpan.className = 'event-text';
            textSpan.textContent = eventData.text;
            el.appendChild(textSpan);

            const chapterSpan = document.createElement('div');
            chapterSpan.className = 'event-chapter';
            chapterSpan.textContent = 'Ch ' + eventData.chapter;
            el.appendChild(chapterSpan);

            // Drag functionality
            let isDragging = false;
            let startX, startLeft;

            el.addEventListener('mousedown', (e) => {
                if (el.classList.contains('editing')) return;
                isDragging = true;
                el.classList.add('dragging');
                startX = e.clientX;
                startLeft = parseFloat(el.style.left);
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const timeline = el.parentElement;
                const rect = timeline.getBoundingClientRect();
                const deltaX = e.clientX - startX;
                const deltaPercent = (deltaX / rect.width) * 100;
                let newLeft = startLeft + deltaPercent;
                newLeft = Math.max(0, Math.min(100, newLeft));
                el.style.left = newLeft + '%';

                // Update data
                const newPos = percentToPos(newLeft);
                const event = eventsData[trackId].find(ev => ev.id === eventData.id);
                if (event) event.pos = newPos;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    el.classList.remove('dragging');
                }
            });

            // Double-click to edit
            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                el.classList.add('editing');
                textSpan.classList.add('editable');
                textSpan.contentEditable = true;
                textSpan.focus();

                // Select all text
                const range = document.createRange();
                range.selectNodeContents(textSpan);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            });

            textSpan.addEventListener('blur', () => {
                el.classList.remove('editing');
                textSpan.classList.remove('editable');
                textSpan.contentEditable = false;

                // Update data
                const event = eventsData[trackId].find(ev => ev.id === eventData.id);
                if (event) event.text = textSpan.textContent;
            });

            textSpan.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    textSpan.blur();
                }
                if (e.key === 'Escape') {
                    // Revert
                    const event = eventsData[trackId].find(ev => ev.id === eventData.id);
                    if (event) textSpan.textContent = event.text;
                    textSpan.blur();
                }
            });

            return el;
        }

        function createTrack(trackId) {
            const events = eventsData[trackId] || [];
            const name = characterNames[trackId] || trackId;
            const arc = arcSummaries[trackId] || '';

            const container = document.createElement('div');
            container.className = 'track-container';
            container.dataset.track = trackId;

            const header = document.createElement('div');
            header.className = 'track-header';
            header.innerHTML = `
                <span class="collapse-icon">▼</span>
                <span class="track-label">${name}<span class="track-subtitle">${arc}</span></span>
                <span class="event-count">${events.length} events</span>
            `;
            header.addEventListener('click', () => {
                container.classList.toggle('collapsed');
            });

            const content = document.createElement('div');
            content.className = 'track-content';

            const scroll = document.createElement('div');
            scroll.className = 'timeline-scroll';

            const timeline = document.createElement('div');
            timeline.className = 'timeline';
            timeline.id = `timeline-${trackId}`;

            const width = BASE_WIDTH * (currentZoom / 100);
            timeline.style.minWidth = width + 'px';

            timeline.innerHTML = '<div class="timeline-line"></div>';
            createChapterMarkers(timeline);

            events.forEach(eventData => {
                const el = createEventElement(eventData, trackId);
                timeline.appendChild(el);
            });

            scroll.appendChild(timeline);
            content.appendChild(scroll);
            container.appendChild(header);
            container.appendChild(content);

            return container;
        }

        function renderAll() {
            const container = document.getElementById('tracks-container');
            container.innerHTML = '';

            // Render by groups
            Object.keys(characterGroups).forEach(groupId => {
                const group = characterGroups[groupId];

                const groupHeader = document.createElement('div');
                groupHeader.className = 'group-header';
                groupHeader.textContent = group.name + ' — ' + group.subtitle;
                container.appendChild(groupHeader);

                group.tracks.forEach(trackId => {
                    const track = createTrack(trackId);
                    container.appendChild(track);
                });
            });

            setupScrollSync();
        }

        function setupScrollSync() {
            const scrollContainers = document.querySelectorAll('.timeline-scroll');

            scrollContainers.forEach(container => {
                let isDown = false;
                let startX, scrollLeft;

                container.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.event')) return;
                    isDown = true;
                    startX = e.pageX - container.offsetLeft;
                    scrollLeft = container.scrollLeft;
                });

                container.addEventListener('mouseleave', () => isDown = false);
                container.addEventListener('mouseup', () => isDown = false);

                container.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - container.offsetLeft;
                    container.scrollLeft = scrollLeft - (x - startX);
                });

                container.addEventListener('scroll', () => {
                    scrollContainers.forEach(other => {
                        if (other !== container) {
                            other.scrollLeft = container.scrollLeft;
                        }
                    });
                });
            });
        }

        // Controls
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomDisplay = document.getElementById('zoomDisplay');
        const textZoomSlider = document.getElementById('textZoomSlider');
        const textZoomDisplay = document.getElementById('textZoomDisplay');
        let currentTextZoom = 100;

        zoomSlider.addEventListener('input', (e) => {
            currentZoom = parseInt(e.target.value);
            zoomDisplay.textContent = currentZoom + '%';
            document.querySelectorAll('.timeline').forEach(tl => {
                tl.style.minWidth = (BASE_WIDTH * currentZoom / 100) + 'px';
            });
        });

        textZoomSlider.addEventListener('input', (e) => {
            currentTextZoom = parseInt(e.target.value);
            textZoomDisplay.textContent = currentTextZoom + '%';
            applyTextZoom();
        });

        function applyTextZoom() {
            const scale = currentTextZoom / 100;
            document.querySelectorAll('.event').forEach(el => {
                el.style.fontSize = (10 * scale) + 'px';
                el.style.maxWidth = (150 * scale) + 'px';
                el.style.padding = (5 * scale) + 'px ' + (8 * scale) + 'px';
            });
            document.querySelectorAll('.event-chapter').forEach(el => {
                el.style.fontSize = (8 * scale) + 'px';
            });
            document.querySelectorAll('.chapter-label').forEach(el => {
                el.style.fontSize = (10 * scale) + 'px';
            });
            document.querySelectorAll('.track-label').forEach(el => {
                el.style.fontSize = (14 * scale) + 'px';
            });
            document.querySelectorAll('.track-subtitle').forEach(el => {
                el.style.fontSize = (11 * scale) + 'px';
            });
        }

        // Keyboard + mouse shortcuts
        // Ctrl+Scroll = text zoom, Shift+Scroll = timeline zoom
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -10 : 10;
                currentTextZoom = Math.max(50, Math.min(200, currentTextZoom + delta));
                textZoomSlider.value = currentTextZoom;
                textZoomDisplay.textContent = currentTextZoom + '%';
                applyTextZoom();
            } else if (e.shiftKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -10 : 10;
                currentZoom = Math.max(50, Math.min(200, currentZoom + delta));
                zoomSlider.value = currentZoom;
                zoomDisplay.textContent = currentZoom + '%';
                document.querySelectorAll('.timeline').forEach(tl => {
                    tl.style.minWidth = (BASE_WIDTH * currentZoom / 100) + 'px';
                });
            }
        }, { passive: false });

        function resetZoom() {
            currentZoom = 100;
            currentTextZoom = 100;
            zoomSlider.value = 100;
            textZoomSlider.value = 100;
            zoomDisplay.textContent = '100%';
            textZoomDisplay.textContent = '100%';
            document.querySelectorAll('.timeline').forEach(tl => {
                tl.style.minWidth = BASE_WIDTH + 'px';
            });
            applyTextZoom();
        }

        function expandAll() {
            document.querySelectorAll('.track-container').forEach(t => t.classList.remove('collapsed'));
        }

        function collapseAll() {
            document.querySelectorAll('.track-container').forEach(t => t.classList.add('collapsed'));
        }

        function exportData() {
            const output = {
                exported: new Date().toISOString(),
                tracks: {}
            };

            Object.keys(eventsData).forEach(trackId => {
                output.tracks[trackId] = eventsData[trackId].map(e => ({
                    id: e.id,
                    pos: Math.round(e.pos * 100) / 100,
                    chapter: e.chapter,
                    type: e.type,
                    text: e.text
                }));
            });

            const json = JSON.stringify(output, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `book2_timeline_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.tracks) {
                        // Update eventsData with imported data
                        Object.keys(data.tracks).forEach(trackId => {
                            if (eventsData[trackId]) {
                                eventsData[trackId] = data.tracks[trackId];
                            }
                        });
                        // Re-render
                        renderAll();
                        alert('Timeline imported successfully!');
                    } else {
                        alert('Invalid file format: no tracks found');
                    }
                } catch (err) {
                    alert('Error importing file: ' + err.message);
                }
            };
            reader.readAsText(file);
            // Reset input so same file can be imported again
            event.target.value = '';
        }

        // Initial render
        renderAll();
    </script>
</body>
</html>
