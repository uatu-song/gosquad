# ============================================================================
# SERIES TOPOLOGY — Auerbach Series (Go Squad), 8 books
# J. S. Vaughn
# ============================================================================
# This file is the ceiling. It does NOT duplicate per-book topology content —
# it aggregates the cross-book spine: what each book owes upstream and
# downstream, character arcs across all 8 books, series-spanning threads,
# seed-to-payoff chains, the CBT→DBT thematic engine, locked endpoints, and
# series-level canon warnings that survive any single-book rewrite.
#
# STATUS: FIRST-PASS DRAFT (2026-05-18)
# Marked `# TODO:` for items needing Director confirmation.
# Marked `# QUESTION:` for genuine forks requiring Director decision.
# Marked `# CANON?:` where I'm uncertain whether a fact is locked or proposed.
#
# PURPOSE: Establish what Book 1 (rebuild) must deliver for Books 2A through 8
# before move-mapping or steward runs begin. Per the handoff (2026-04-03), this
# is step 1 of the 8-step Book 1 rebuild sequence.
#
# ARBITRATIONS LOG: 5_story_bibles/CANON_ARBITRATIONS.md
# (Latest: 2026-05-18 — 12 Book 4 conflicts arbitrated; HARD calls locked,
#  SOFT calls proposed pending Director ratification.)
# ============================================================================

meta:
  series: "Auerbach Series"
  also_known_as: "Go Squad"
  author: "J. S. Vaughn"
  book_count: 8
  numbering_note: >
    Original 7-book series became 8 when Book 2 split into 2A/2B due to 120K+
    word count. Within this file, books are keyed by their canonical names
    (book_1, book_2a, book_2b, book_4, book_5, book_6, book_7, book_8) — note
    that there is no `book_3` key; new Book 3 is referred to as 2B everywhere
    in the repo. Directory names are legacy (`book_2b/` = new Book 3, dir
    `book_3/` = new Book 4). See CLAUDE.md renumbering table.

  core_thesis: "You don't have to be fixed to be worthy."

  thematic_engine:
    name: "CBT → DBT"
    description: >
      The series follows a psychological progression. Early books (1, 2A, 2B,
      4) prove the Cognitive Behavioral Therapy approach — try harder, think
      correctly, evidence the truth — fails against a world that doesn't
      respond to reason. Book 5 is the turning point where Dialectical
      Behavioral Therapy is introduced (both/and thinking, radical acceptance,
      worth without being fixed). Books 6-8 show DBT succeeding.
    phases:
      cbt_failing:
        books: ["book_1", "book_2a", "book_2b", "book_4"]
        proves: >
          Effort doesn't fix it. Truth doesn't fix it. Heroism doesn't fix it.
          Sacrifice doesn't fix it. Confidence doesn't fix it. The harder Ahdia
          tries to control / fix / save / outsmart, the more she burns.
      turning_point:
        books: ["book_5"]
        proves: >
          # TODO: confirm Book 5's specific turning-point mechanism. The handoff
          # says "turning point (stalemate, DBT)" — proposed: Ahdia stops trying
          # to win and learns to accept what is.
      dbt_succeeding:
        books: ["book_6", "book_7", "book_8"]
        proves: >
          # TODO: confirm. Per CLAUDE.md these are "DBT approach succeeding" but
          # no per-book content has been documented yet.

  structural_acts:
    act_1_isolation:
      books: ["book_1"]
      label: "Avoidance → Forced action"
    act_2_sacrifice:
      books: ["book_2a", "book_2b"]
      label: "Sacrifice → Vulnerability → Defeat"
    act_3_collapse:
      books: ["book_4"]
      label: "Confidence → Incomprehensible challenge → Psychological collapse"
    act_4_acceptance:
      books: ["book_5"]
      label: "Turning point — stalemate, DBT"
    act_5_resolution:
      books: ["book_6", "book_7", "book_8"]
      label: "DBT succeeding — worthiness without being fixed"

  series_endpoint:
    # TODO: locked? The handoff doesn't state a series-level endpoint.
    # Proposed: Ahdia alive, unfixed, accepted, with chosen family. Firas
    # returned. Bellatrix arc resolved. Series resolves to: "worthiness
    # without being fixed" lived, not theorized.
    status: PROPOSED

