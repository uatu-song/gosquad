    act_1: { chapters: "1-8", label: "Origin", summary: "Go Squad introduced. Warehouse incident. Ahdia bonds with Hyper Seed, saves everyone. Presumed dead." }
    act_2a: { chapters: "9-16", label: "Rising", summary: "Powers manifest. Ahdia secretly enables Go Squad from CADENS. Training montage. Rising hope." }
    act_2b: { chapters: "17-22", label: "Reversal", summary: "Kain sets trap. EMP ambush strips powers. Mansion heist — the fight is the motive: Kain misprices the category and takes the Tamois Heart during the blackout." }
    act_3: { chapters: "23-30", label: "Climax", summary: "Ahdia revealed. Kain becomes kaiju. Missile. Singularity. Firas lost (on the page). Team rebuilds from a stolen MCC." }

