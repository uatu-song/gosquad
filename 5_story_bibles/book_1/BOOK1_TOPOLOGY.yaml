  - number: 22
    words: 3457
    timing: "N+1 evening, continuous from ch21 — 'tonight'; the first cold snap of the year (weather, not season). The fight runs in three movements; the alley coda follows"
    pov: "Tess (single POV throughout; staging A, Director-ruled 2026-09-02 — on the twelve-camera grid two blocks east for movements 1–2, in the room for movement 3)"
    locations: ["Kain's office (twelve inward-pointing cameras; oak desk; the plinth between the bookcases with the Heart lit in its case; west wall of glass over thirty feet of nothing, gravel, the fountain)", "Parking structure two blocks east", "The mansion's kitchen, service stair, electrical room, linen shelf", "A loading dock three blocks east (Jericho)", "The fountain", "The alley three blocks east"]
    characters_present: [Tess, Leah, Ben, Victor, "Kain (zip-tied, in the wheeled chair)", "Dr. Jericho (unconscious)", "twelve+ TRIOMF guards", "Firas (arrives on foot)", "Selfie civilian", "Ruth (phone, then the VTOL ramp)"]
    movements:
      m1_smoke: "'Open fire!' — Leah wheels zip-tied Kain into the middle of the floor under his own chandelier as a nine-figure obstruction nobody can shoot through; Victor tips the champagne bucket (goggles), smoke; Leah's heels off 'as ordnance', barefoot in the gown; the chair's armrests; Ben's forearm 'like a rail he expected somebody to use' — the derby whip, 'She had never once seen it done in a gown.'; Ben and Victor back to back 'like one slow animal'; the team makes no sound and the guards' noise tells them where everyone is ('four years of somebody standing at the mats saying do it again, softer'); Tess: 'They were holding... without her and without Gale... and it turned out that had its own cold under it.' Kain's face 'did what her father's face did at a car dealership. He thought he was watching equipment... he would find out who, and then he would buy two.'"
      m2_clear_air: "Ben runs the paneling; a guard through the west glass — a four-foot hole; the smoke pours out and the room resolves — 'And they kept winning.' The room works with them (the drape, the bookcase, the desk); somebody into the plinth — the case 'came down starred across one corner'; every loose rifle goes out the hole; the guards drift to the walls. 'Firas built this.' KAIN STOPS MOVING HIS HEAD and looks at one place — the plinth. Tess reads it as a rich man taking inventory. Fresh guards; Victor down on one knee; Leah's hostage; 'Gale?' — nothing ('four years of asking does not switch off in a day'); Victor cornered at the plinth steps into the open with his hands out; a guard saws Kain's ties 'with his eyes on the fight the whole time... without once having looked at the man's face. Kain did not get up. He put his freed hands flat on his knees and went on looking at the plinth.'"
      m3_the_dark: "The lights die — one second of total dark (Tess pulled every breaker by feel). Her eleven translocations, numbered: structure roof → boxwood → kitchen door → service stair → electrical-room window → inside → linen shelf → Jericho to the loading dock (tasting pennies) → the office crown molding, eight feet up, goggles on. One second, two things: the knife over Ben, or 'a man who had sat in a chair all night... on his hands and knees at the plinth with his face turned up into the light.' 'She picked Ben.' Nine: Ben out. Ten: the chandelier onto two men. Eleven: Battlea onto the desk. The emergency circuit: 'The chair by the desk lay on its side and empty, the ties cut through, and on the plinth the light had changed color while she was not watching it.'"
    key_events:
      - "'Jericho?' 'Got him.' 'Data drive?' 'Downloaded.' 'Then we're leaving.' — 'Hands up!'"
      - "Out the four-foot hole in the west glass: Tess takes Ben and Leah, comes back up for Victor ('Trust me'); 'parkour, which is the art of refusing the straight line down' — she bends the fall into three feet of green water"
      - "The alley: 'What the hell just happened?' 'Gloom Girl happened.' 'That was insane.' (Victor) 'That was fun.' (TESS — the 2026-09-02 tag pass returned it to her; order Victor → Tess → Leah's laugh, veto open)"
      - "Firas arrives ON FOOT at the alley mouth, a flat hand over his ribs — 'Walking was the only way any of them ever went.'"
      - "Selfie civilian (a woman in her sixties, bathrobe and slippers): 'We see you. All of us. We see you.'"
      - "The light red and gold on the east face of the house — Tess knows it 'because it was hers': space folding, run backward. HARDING KAIN WALKS OUT THROUGH THE FRONT WALL OF HIS OWN HOUSE, the Heart sunk in his chest red-then-gold, eyes flickering; looks at the sky 'a man checking the weather before a drive'; finds them three blocks east in the dark; smiles; walks off through the side of an apartment building"
      - "'The cops? The cops who work for him?' — the phone rings, unknown number: 'No better place than here,' Ruth"
      - "Tess decides she wants a different name than Gloom Girl"
      - "The VTOL decloaks forty feet up; Ruth on the ramp in matte-black CADENS armor 'none of which anybody had seen her wear'"
    ending_line: "“Need a ride?” — Ruth, from the ramp. FUNCTION: the team's first sight of Ruth as CADENS; the ride is CADENS's aircraft, not a team vehicle. (The fight itself closes one section earlier on the plinth light having changed color — the thing Tess chose not to watch. The Director's brief describes ch22 as ending on the light; the shipped chapter's final line is Ruth's. Both recorded; not resolved here.)"
    emotional_arc: "Heist exhilaration → pride in a thing Firas built working at full size → cosmic horror"
