    status: "DISPLACED into dimensional space (NOT dead). Returns Book 7."
    last_words: '"Oh hey. I knew you were in there somewhere."'

  ruth_carter:
    role: "Go Squad field leader, medic, Ahdia's best friend"
    codename: "Nightingale"
    background: "Emergency medicine background. Developed CR-7 experimental healing treatment."
