characters:

  ahdia_bacchus:
    role: protagonist
    age: 21
    background: "Depressed recluse living off inheritance. Parents (Faraz and Naima) disappeared in Montana when she was 7. Brother Firas is her only family."
    book1_arc: "Isolation → reluctant involvement → secret hero → revealed → accepted"
    powers:
      type: "Temporal manipulation (freeze, slow, selective bubbles, acceleration)"
      source: "Hyper Seed — 4D cosmic object, bonded during warehouse explosion (Ch7)"
      cost: "Every use burns cellular integrity. 6 hours in one night = 23% depletion."
      range: "~30-40 feet optimal"
      discovery: "Blue = freeze/decelerate. Red = accelerate/push forward (discovered Ch24 vision)."
    baseline_trajectory:
      ch7: "100% (bonding moment)"
      ch14: "77% (after 6 hours of temporal manipulation saving Go Squad)"
      ch19: "18% (critically depleted after saving Ruth from Tank)"
      ch24: "~30% (partial recovery via CR-7, deploys anyway)"
      ch29: "Near-zero (opposing temporal forces, begins transcending — Firas injects final CR-7)"
      ch30: "Stabilized at ~30% after CR-7 takes effect. 18-24 months projected with ongoing treatment."
    voice:
      casual_contemporary: '"What the actual hell?"'
      tv_processing: "Frames real events through TV/movie references"
      deadpan_absurdity: "Accepts impossible situations flatly"
      self_deprecating: "Doesn't believe she has inherent worth (beginning to challenge by end)"
    codename: "Auerbach (assigned by CADENS, parents' legacy)"
    key_relationships:
      firas: "Brother. Only family. His 'already dead inside' comment is her deepest wound."
      ruth: "Best friend, co-conspirator, life-saver"
      ryu: "Handler, friend. He's in love with her (unspoken). She doesn't know."
    end_state: >
      Penthouse with stolen CADENS mobile command center on roof.
      Tactical support, not field leader. Declined CADENS membership.
      Grieving Firas. Beginning to believe in inherent worth.
      18-24 months to live with treatment.

  firas_bacchus:
    role: "Ahdia's brother, Go Squad co-founder"
    codename: "Rogue Leader"
    background: "Vigilante freerunner. Suicidal ideation kept at bay only by Go Squad work."
    book1_arc: "Protector → wounded → sidelined → sacrifices himself"
    key_beats:
