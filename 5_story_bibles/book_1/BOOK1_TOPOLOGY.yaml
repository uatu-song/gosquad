# ============================================================================
# CHAPTER TOPOLOGY
# ============================================================================
# Clock convention for ch17–30 (Director-ruled chain, log 2026-09-02 + bible §7d/§7f):
#   night N  = the docks op, 2100 hours, late September (ch18–19)
#   N+1 02:00 = Ruth offered the isotopes at CADENS (ch19)
#   N+1 day/evening = the heist set-up and the mansion fight, "tonight" (ch21–22)
#   N+1 ~23:00 = Ahdia's real waking, TWENTY-SIX hours under (ch24) → Main Street (ch24–29)
