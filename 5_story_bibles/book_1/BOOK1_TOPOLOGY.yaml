threads:

  the_big_lie:
    description: "Go Squad's powers are fake — actually Ahdia's temporal manipulation + FAERIS amplification"
    planted: "Ch12 (Ahdia alive, watching frozen), Ch14 (Bourn explains), Ch16 (fake triggers designed)"
    payoff: "Ch19 (Ruth discovers), Ch23 (partial reveal to team), Ch25 (Ahdia tells all)"
    mechanism: >
      Each team member assigned a physical trigger (crouch+jump, battle cry, etc.)
      that 'activates' their power. Actually Ahdia creating temporal bubbles + FAERIS
      force amplification. Ruth's 'power' is that she doesn't have one — her tactical
      leadership amplifies everyone.

  ahdia_dying:
    description: "Hyper Seed bonding is converting Ahdia's biology. Every power use accelerates death."
    planted: "Ch14 (Bourn reveals 18 months), Ch15 (Ryu confirms)"
    known_by: "Ahdia, Ryu, Bourn, Ruth (from Ch19)"
    not_known_by: "Go Squad team (don't know she's dying through end of Book 1)"
    hidden_truth: "Cellular death = transcendence, not death. Treatment prevents transcendence. Ahdia doesn't know this."

  kain_conspiracy:
    description: "Kain's criminal empire, TRIOMF, political ambitions, and cosmic artifact collection"
    key_elements:
      - "23 artifacts in vault including Tamois Heart"
      - "TRIOMF shell company"
      - "Tank cops (enhanced officers)"
      - "Clone body consciousness transfer system"
      - "Mystery woman (Bellatrix) feeding him intel"
    payoff: "Kain transforms with Tamois Heart (Ch22-28), survives via clone (epilogue)"

  cadens:
    description: "Secretive government organization monitoring Ahdia and cosmic threats"
    key_elements:
      - "FAERIS drone fleet (learning to replicate Ahdia's powers)"
      - "Mother FAERIS exploitation (forced drone production, Bourn knows)"
      - "Surveillance of everything since warehouse"
      - "Medical treatment dependency"
    hidden: "TRIOMF has infiltrated CADENS (discovered Book 2)"

  firas_displacement:
    description: "Firas pulled into singularity during climax"
    status: "Displaced into dimensional space, NOT dead"
    everyone_believes: "He's dead"
    truth: "Returns Book 7"
    last_words: '"Oh hey. I knew you were in there somewhere."'

  bellatrix_shadow:
    description: "Mystery woman manipulating events from behind the scenes"
    appearances:
      - "Ch17: Phone call to Kain, feeding intel 6 months"
      - "Ch29: Ahdia contacts her briefly in the hallway during transcendence"
      - "Epilogue: Instructs Kain on next moves, reveals she's the real power"
    payoff: "Becomes major antagonist Books 2-4"

  go_squad_formation:
    description: "Team of vigilantes becomes something more"
    origin: "Ruth and Firas met through ER visits → fell in love → built team"
    members_revealed: "Ch12 (real identities shared for first time)"
    roster:
      night_knight: "Ben — ex-Marine"
      gloom_girl: "Tess — Chief's daughter"
      battlea: "Leah — roller derby"
      crimson_sable: "Victor — community center"
      nightingale: "Ruth — medic"
      rogue_leader: "Firas — freerunner"
    rules: "No guns, no real names (until Ch12), stay secret"

  hyper_seed:
    description: "4D cosmic object that bonds with Ahdia"
    bonding: "Ch7 — Ahdia shot through TRIOMF crate, has vision of dead mother, Seed bonds"
    properties:
      - "Converts host biology over time"
      - "Enables temporal manipulation"
      - "Connected to cardiovascular, nervous, skeletal systems"
      - "Dormant after singularity exposure but still integrated"
    vision: "Ch24 — hallway with blue doors (past/freeze) and red doors (future/accelerate). Something vast observes."

  cr7_treatment:
    description: "Ruth's experimental healing treatment adapted for temporal stress"
    original: "CR-7 — heals at 1.8x rate (used on Firas Ch3)"
    adapted: "CR-7 Temporal Variant — extends Ahdia's timeline from weeks to 18-24 months"
    dependency: "Only Ruth and Ryu can administer. Requires CADENS facilities."
    hidden: "Prevents transcendence, not death (Ahdia doesn't know)"

