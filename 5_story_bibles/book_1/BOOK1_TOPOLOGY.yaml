    the Director's; a plain `wc -w` on the shipped drafts differs from them by up to
    ~30 words on ch23/25/26/30. ch12–21 figures are unchanged from the 2026-08-30 update.
  chapter_count: 30  # + epilogue (ch30's final section; see epilogue_note)
