  series_position: "Book 1 of 8. Books 1-3: CBT approach failing. Book 4: turning point. Books 5-8: DBT succeeding."
  timeline: >
    Present-day action runs ~Aug 12 (Firas shot; Jericho abducted) → Aug 14 (the
