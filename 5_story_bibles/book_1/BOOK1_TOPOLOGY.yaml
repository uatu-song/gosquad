characters:

  ahdia_bacchus:
    role: protagonist
    age: 27  # Director-ruled twenty-seven (2026-09-01); both on-page sites (ch14a heart-attack line, ch19) read twenty-seven. The earlier "21" and "twenty-three" are drift.
    background: "Depressed recluse living off inheritance. Parents (Faraz and Naima) disappeared in Montana when she was EIGHT (Director-ruled; ch2 'eight and six years of their lives, respectively'; ch3 'over fifteen years ago'). Brother Firas is her only family."
    book1_arc: "Isolation → reluctant involvement → secret hero → revealed → accepted"
    powers:
      type: "Temporal manipulation (freeze, slow, selective bubbles, acceleration)"
      source: "Hyper Seed — 4D cosmic object, bonded during warehouse explosion (Ch7)"
      cost: "Every use converts cellular substrate (bible §5b: one process, three faces — threads/ledger/frontier). 6 hours in one night = 23% of what remained."
      range: "~30-40 feet optimal"
      discovery: "Blue = freeze/decelerate (the whole history of it through ch23). Red = accelerate/push forward — dreamed in ch24, first used on herself in the medical bay (ch24), on the team at Main Street (ch24–25), on Firas's sedan (ch26), into the singularity (ch29)."
      end_of_book: "Dormant. Ch30, her own words to Bourn: 'I can't use my powers anymore. The Seed's dormant. Maybe permanently.' (ON THE PAGE.)"
    baseline_trajectory:
      ch7: "100% (bonding moment)"
      ch14: "77% (after 6 hours of temporal manipulation saving Go Squad) — note §5b: the 23% was of what remained; reserves and telomere integrity are different axes and do not subtract"
      ch19: "18% (critically depleted after saving Ruth from the docks Tank)"
      ch20: "Dose 1 of CR-7 Temporal Variant, administered by Ruth. Interval three weeks to start, monthly once stable (§7e). Eight autoinjectors remain."
      ch24: "Takes SEVEN of the eight in ~fifteen seconds by accelerating her own cells; FAKES the eighth and palms it ('nothing went in. Her fist took it under the gown.'). Ryu: 'Maybe thirty percent total regeneration.' Deploys anyway."
      ch29: "Near-zero (opposing temporal forces, red and blue through one body; the corridor). Firas injects the palmed dose into HER while she is gone."
      ch30: "ON THE PAGE: the scan says she left CADENS at 'approximately one-third cellular recovery'; the Seed is dormant, 'maybe permanently'. No post-ch29 percentage is stated anywhere. The earlier '~30% stabilized, 18-24 months with treatment' end-state is a projection from ch16/ch20 dialogue, not a ch30 fact — UNRULED as an end-of-book number."
    voice:
      casual_contemporary: '"What the actual hell?"'
      tv_processing: "Frames real events through TV/movie references (Marky Mark and the Funky Bunch, Godzilla, the coyote and the anvil, workplace comedies)"
      deadpan_absurdity: "Accepts impossible situations flatly ('hospital chic'; 'I got better')"
      self_deprecating: "Doesn't believe she has inherent worth (beginning to challenge by end). 'You're no hero.' / 'No. I'm really, really not.' (ch26) — the truest thing she has said out loud in weeks."
      the_voiceover: "Ch26: she stands slightly to the left of herself and narrates the girl in the gown; the voiceover cuts out the moment Firas looks at her."
      counting_note: "Counting-as-interiority is BANNED for her too (Director reversed the crew carve-out 2026-08-31). Her card's 'compulsive quantification' trait does not license it in narration."
    codename: "Auerbach (assigned by CADENS, parents' legacy; Bourn picked it herself, ch15). 'Agent Auerbach' in the epilogue woman's mouth."
    key_relationships:
      firas: "Brother. Only family. His 'already dead inside' comment is her deepest wound. Reconciled inside the frozen impact tableau (ch26: 'We need to talk about it. Later.'). He dies for her on the page (ch29)."
      ruth: "Best friend, co-conspirator, life-saver. Ruth learned the truth at the docks ONE DAY before Main Street (§7d); Ahdia's 'two weeks ago? Maybe three?' (ch25) is characterised error, kept frozen."
      ryu: "Handler, friend. He's in love with her (unspoken). She doesn't know. By ch30 she has dropped the 'Dr.' somewhere in twelve hours of debriefing."
    secrets_kept_at_end: "She tells nobody about the corridor or the thing in it — not Ryu, not Bourn, not the team (ch30). She never explains the palmed dose to anyone; CADENS finds it on a scan. Nobody ever tells her about the fifth Tank."
    end_state: >
      Penthouse with the stolen CADENS mobile command center cloaked on the roof
      ("a machine she had taken out of a hangar without filling in anything"),
      wearing a coat and socks, holding an unlit cigarette, running comms:
      "Go get 'em. I got your back." Tactical support, not field leader.
      Declined the CADENS badge ("The couch has been booty calling me").
      Grieving Firas. Beginning to believe in inherent worth. Seed dormant.

  firas_bacchus:
    role: "Ahdia's brother, Go Squad co-founder"
    codename: "Rogue Leader"
    age: 25  # derived in the log from Ahdia's ruled twenty-seven ("puts Firas at 25, founding at 21"); six at Montana
    background: "Vigilante freerunner. Suicidal ideation kept at bay only by Go Squad work."
    book1_arc: "Protector → wounded → sidelined → sacrifices himself"
    key_beats:
      - "Ch1: Patrols Caledonia rooftops, stops mugging"
      - "Ch3: Found shot on Ahdia's bathroom floor"
      - "Ch5: Reveals warehouse discovery, Kain, 4D object"
      - "Ch12: 'Was already dead inside anyway' — Ahdia overhears (deepest wound)"
      - "Ch21: Signs the PAC donation that bought 'Sophie Clement' her invitation 'out of his sister's estate' (Director-ruled clause; narration only, nobody comments)"
      - "Ch22: Too wounded to climb; arrives on foot at the alley mouth after the fight ('Walking was the only way any of them ever went.'). The fight was his: 'Firas built this.'"
      - "Ch23: Does not board the VTOL; takes the drives from Ben's fist and walks them east to the dock"
      - "Ch26: Drives a gray civilian sedan with a familiar front-quarter dent into Kain; Ahdia freezes the impact; SIBLING RECONCILIATION in the frozen tableau; gives her his armor ('I'm benched. You're not.'); waits in the sandwich-shop doorway in a t-shirt"
      - "Ch27: Gloom Girl translocates him out of the intersection before the Tanks are broken open"
      - "Ch29: Crosses the last ten feet with no Seed and puts his hands over hers; the cracks come up his forearms; injects her with the palmed dose while she is in the corridor; 'Oh hey,' he said. 'I knew you were in there somewhere.'; dissolves into light and is absorbed by the point"
    status_on_the_page: "LOST. Every character reads death: Ruth 'We just lost Firas. Yesterday.'; Ahdia 'She was alive because he decided she would be. She never got to say goodbye.' Even the epilogue woman does not know he survives. No narration says otherwise."
    status_author_level: "DISPLACED into dimensional space (NOT dead). Returns Book 7. This never reaches the page in Book 1 (endpoint rule, §5b)."
    last_words: '"Oh hey. I knew you were in there somewhere." — shipped as two spans: “Oh hey,” he said. / “I knew you were in there somewhere.” (ch29)'

  ruth_carter:
    role: "Go Squad field leader, medic, Ahdia's best friend"
    codename: "Nightingale — 'Gale' on comms (Nightingale shortened; ch22 Leah: 'Gale?'). NOT a separate character."
    background: "Emergency medicine background (Johns Hopkins). Developed CR-7 experimental healing treatment; papers published three years back."
    book1_arc: "Team medic → discovers truth → co-conspirator → field leader"
    key_beats:
      - "Ch3: Emergency surgery on Firas using CR-7"
      - "Ch5: Tells Go Squad origin story"
      - "Ch19: Watches Ahdia work in frozen time — discovers the truth. Isotopes offered 'at two in the morning' by 'Director Overseer Bourn'"
      - "Ch20: Develops CR-7 Temporal Variant in four hours, administers dose 1; agrees to Bourn's role"
      - "Ch22: Calls Tess from an unknown number — 'No better place than here' — and arrives on the VTOL ramp in matte-black CADENS gear: 'Need a ride?'"
      - "Ch23: Reveals partial truth to the team ('They were never yours to begin with'); refuses to name Ahdia; interrogates Jericho; goes downtown with the team without authorization"
      - "Ch25 (POV): Hears Ahdia's 'two weeks' and lets the wrong number lie; the team turns on her; 'a liar with a plan beat four honest people without one'; 'Then let's run.'"
      - "Ch28: Hauls Ahdia through the fight ('Can you run?' — a lie she takes); 'I'm a doctor. ER. I've got this.'"
      - "Ch29: Shoved clear by Ahdia; pinned by the pull at a parking meter; anchors the human chain on Ahdia's arm and never lets go"
      - "Ch30: 'We're done' → Leah's 'You've been carrying us' → Ahdia in the doorway → 'If we do this, we start over.' Leads the rooftop: 'No better place.' / 'No better time.'"
    end_state: >
      Field leader. Co-conspirator with Ahdia managing the truth (from ch19/ch20).
      Bourn's ch20 role (keep Ahdia alive, manage the transition) accepted on the page.
      The team-wide CADENS membership offer (ch23 'I'm offering... Can we think about it?')
      is never answered on the page — UNRULED. Only she and Ryu can administer treatment.
      At the end she floats an inch off a gravel roof with 'no cable, no wing out' —
      the FAERIS enhancement from ch20, unexplained by anyone.
    key_phrase: '"You''re worth saving. Not because you''re useful. Because you''re a person who deserves to live."'
    power_status: "AMBIGUOUS and NEVER resolved (bible §7): 'Ruth got no trigger, because Ruth had no power.' Maybe FAERIS treats her callouts as targeting data; maybe she is that good. Ahdia ran it both ways and left it (ch16)."

  ryu_matsuda:
    role: "CADENS FAERIS Operations Specialist, Ahdia's handler"
    name_note: "Ryu MATSUDA (standing ruling; on the page in ch15's HUD tag and ch16's badge). 'Shiba' was invented drift in the ch30 source, 14 sites, corrected 2026-08-31 — it appears nowhere in the shipped book."
    book1_arc: "Professional handler → genuine friend → secretly in love"
    key_beats:
      - "Ch13: Introduced as Ahdia's handler at CADENS"
      - "Ch15: Manages AR-Ryu system, monitors cellular integrity; 'forty-seven slides'"
      - "Ch16: Co-designs fake power triggers with Ahdia"
      - "Ch19: Extracts Ruth by radio ('My name is Ryu. I'm here to extract the asset.')"
      - "Ch20: Works with Ruth on CR-7 Temporal Variant; FAERIS independent capability three days old"
      - "Ch24: At the bedside when she wakes ('twenty-six hours'); writes RATIO = 1:2000 / TOO FAST = CELLS BURN / TRY 1:1500 / SLOW DOWN on a tablet against the glass of her speed; his fingers count along (the author's own beat — licensed)"
      - "Ch30: Twelve hours of debriefing wears the 'Dr.' off; Bourn shows him the scan — 'She didn't take it.' is HIS line (the eighth treatment); learns the authorization arrived fourteen hours late"
    systems:
      ar_ryu: "HIS system from before Ahdia. Receives uploads of frozen time experiences. Works in frozen time via HUD."
      faeris: "Operates FAERIS drone fleet. Drones learning to replicate Ahdia's powers (~10% effective at ch20, three days old; projected 50% in six months)."
    hidden: "In love with Ahdia (unspoken, telegraphed to reader). Watches her when she isn't looking. Never confesses in Book 1."

  harriet_bourn:
    role: "CADENS Director — codename OVERSEER ('Director Overseer Bourn', ch19; 'Overseer' on Mack's comm, ch28; 'Overseer wants to see you', ch30)"
    pronouns: "SHE/HER (Bourn is a WOMAN). Three ch23 misgenderings and a ch28/ch29 'man named Bourn on the street' were source drift, corrected; the shipped book is clean."
    field_rule: "She is NEVER on the pavement. Colonel Mack commands the ground in ch28–29 and reports to her by comm."
    book1_arc: "Institutional authority → recruiter → uneasy ally"
    key_beats:
      - "Ch13: First meeting with Ahdia on Parkour Academy rooftop"
      - "Ch14: Full briefing — powers, cost, parents' legacy"
      - "Ch19: Meets Ruth at CADENS; offers the lab and the isotopes"
      - "Ch23: On the pad — 'Ryu says she's awake' (a status line HOURS stale, §7f); offers the team armor and membership; left alone in her briefing room watching five people run at a twenty-foot god 'because nobody else would go without a signature'"
      - "Ch24: Arrives in the same unwrinkled suit; comes in to say no and 'everyone in the room heard the sentence change sides' — 'We're out of time.'"
      - "Ch28: By comm only. 'Confirmed kill?' Mack fired the cruise missile WITHOUT waiting for Pentagon/SecDef clearance — 'Overseer wanted authorization before engaging... We stopped waiting.' The CADENS missile (Bourn's command, Mack's call) is the real kill of body 47."
      - "Ch30: Debriefs Ahdia ('reckless and effective' is her verdict on the palmed dose, delivered to Ryu); offers the badge (declined); 'We have no reason to monitor you anymore, Ms. Bacchus.'; the executive clearance she requested six hours before the fight arrived 'Forty-seven minutes ago. Fourteen hours after the event concluded.'"
    end_state: "Compartmentalized ethics. Documents everything and waits. Knows about Mother FAERIS exploitation (author-level; not on the Book 1 page). Doesn't yet know about TRIOMF infiltration."

  harding_kain:
    role: "Primary antagonist — diamond magnate and presidential candidate ('Mayor' was drift, ruled 2026-08-29)"
    book1_arc: "Magnate/candidate → the mispricing → the Heart → kaiju → 'destroyed' → survived via clone"
    key_beats:
      - "Ch7: Interrogates Ruth, fires RPG at Go Squad"
      - "Ch17 (POV): Prices 'the blur', buys an EMP and Tanks to neutralise it; 23 artifacts including the Tamois Heart; Jericho given forty-eight hours; the Intermediary's third call in six months"
      - "Ch18: The EMP trap springs at the docks (2100 hours)"
      - "Ch22: Zip-tied and wheeled into the centre of his own office, he WATCHES the fight — powers off, four unarmed people beating twelve armed professionals. THE MISPRICING (Director's engine): he did not misprice the asset, he mispriced the category — training cannot be jammed or bought. Tess's camera reads it: 'He thought he was watching equipment... he would buy two.' M2: he stops moving his head and looks at the plinth. M3: a guard saws his ties with his eyes on the fight; Kain puts his freed hands flat on his knees and goes on looking. Takes the Heart in the one-second blackout (off camera); walks out through the front wall of his own house, the Heart red-then-gold in his chest"
      - "Ch23: Razing Caledonia block by block; twenty feet on Main Street with four Tanks"
      - "Ch24–26: Twenty-three feet; frozen mid-step with teenagers in his fist; banter ('hospital chic'); learns not to swing — grabs and squeezes; hit by Firas's sedan"
      - "Ch27 (POV): Watches the Go Squad break his four Tanks open and the Heart fragments come home; 'Thank you... I was wondering how to reclaim those fragments.'; grows past forty; 'He had priced that before he ever put it in his chest' — now the lie he tells himself"
      - "Ch28: Cruise missile to the chest; 'Kain is dead.'; the body folds inward into a point; SINGULARITY"
      - "Ch30/Epilogue: Press conference ('nowhere near downtown'; a lookalike; a bioweapon; 'terrorist attack'); forty-seven seconds down to the tank room; cylinder Forty-seven empty ('An acceptable loss'); three more Hearts in storage; told to focus on the election"
    clone_system: "Rows of clone bodies in tanks — himself at nine, at forty, at fifty. Body 47 ('our best integration') is what died downtown. Nobody outside the tank room knows. Consciousness-transfer mechanics are NOT described on the page."
    tamois_heart: "Organic artifact, 4.7 billion years old, a seed 'from something vast'. Kain cut it and distributed fragments into four Tanks; the fragments drain back into him when the Tanks are beaten (ch27). Three more in storage (epilogue)."
    accounting_voice: "Kain-POV chapters (ch17, ch27, epilogue) are EXEMPT from the accounting-metaphor ban (R106) — the Director's own ruling: a businessman who bought a god. The only counting in ch30 is his forty-seven-second elevator."
    end_state: "Alive, off the board, in a clone body. Presidential candidacy live and UNRESOLVED — B1 ends before November (Director-ruled 2026-08-30); the loss/rebuild arc lands between books, the win in Book 3."

  ben:
    role: "Go Squad member"
    codename: "Night Knight"
    background: "Ex-Marine, tactical mind. Most suspicious/analytical team member."
    book1_arc: "Disciplined soldier → discovers powers → skeptical of truth"
    fake_power: "Crouch + jump (actually Ahdia's temporal bubble; trajectory amplification)"
    key_beats:
      - "Ch21: 'Ninety percent chance. If there's biometric locks too, you'll need to improvise.'"
      - "Ch22: Behind the oak desk; puts his forearm out 'like a rail he expected somebody to use' — Leah's derby whip; back-to-back with Victor 'like one slow animal'; runs the paneling and puts a guard through the west glass; under a knife when Tess picks him"
      - "Ch23: 'Medium version. With explanations.'; recalculates four years of tactics; picks his case up off the cart: 'We're not waiting.'"
      - "Ch25: 'We trusted you.'"
      - "Ch28: Takes Victor, Leah and himself out of Kain's radius in one tackle"
      - "Ch29: Anchors Leah in the chain. Ahdia's narration calls him 'Ben' for the first time inside the chain paragraph — nowhere earlier"
    end_state: "Knows Ahdia has powers. Doesn't know full CADENS involvement. (What the team knows of her prognosis at the end: see canon_warnings → UNRULED.)"

  tess_whitford:
    role: "Go Squad member"
    codename: "Gloom Girl (a name she picked at nineteen 'to be funny about the worst thing in her life'; in ch22 she decides she wants a different one)"
