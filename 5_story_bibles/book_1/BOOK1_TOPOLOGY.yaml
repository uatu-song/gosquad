canon_warnings:
  critical:
    - "Firas is DISPLACED, not dead (AUTHOR-LEVEL). ON THE PAGE the team loses him and every character reads death. Returns Book 7. Label both levels whenever you write about it."
    - "Metamorphosis is AUTHOR-LEVEL (bible §5b). Every character on the page reads the clock as death. No character speculates; no narration editorializes the door; Ryu's terminal framing is sincere."
    - "The entity in the corridor is UNNAMED in Ahdia's POV (ch29) and named — as Bellatrix — only in the epilogue dialogue. Ahdia tells nobody about the corridor."
    - "Go Squad 'powers' were NEVER real — always Ahdia's dilation bubbles + FAERIS. Ruth's is AMBIGUOUS; never resolve (§7)."
    - "FIVE Tanks, not four. Four fight at Main Street (Edgar, Ogden, Philips, Orlansky — locked). The fifth is alive, off the board, removed by Ahdia at the docks (ch19, 'did not come out of it'), and nobody ever tells her. Promise `fifth-tank-survivor`, payoff unassigned. Not a kill: Ahdia has no body count in Book 1."
    - "Ahdia was under for TWENTY-SIX HOURS (docks 2100 → surfaces during the mansion feeds without keeping it → real waking after the Main Street rampage). Both ch24 sites read twenty-six. 'Eighteen' is gone."
    - "THE PALMED DOSE: Ahdia faked the eighth dose in ch24 and pocketed it; the injector goes into HER in ch29 (Firas's thumb on the plunger). CADENS finds it on a scan in ch30; nobody confronts her; she explains it to no one."
    - "Kain survives OFF-BOARD via clone (body 47 died downtown; rows of himself in tanks). The CADENS/Bourn cruise missile — fired on Mack's call without waiting for the Pentagon — is the real kill of that body. Kain's presidential candidacy is UNRESOLVED at book's end (B1 ends before November)."
    - "'We killed them.' is TESS's line — unattributed in ch27 (Kain's POV) by ruling, owned in ch28 (Ahdia knows). She translocated out with Firas before it landed."
    - "ENDGAME BASE: the stolen CADENS MCC cloaked on the penthouse roof + wingsuits are the two ruled exceptions to 'no vehicle, ever' (with cover vehicles, e.g. the catering van). The MCC is a BASE, not transport; nobody drives it, ever. Neither licenses a car or van in any book. (The ch26 sedan is on the page and outside the list — UNRULED.)"
    - "Bellatrix on the page: ch29's near-transcendence (unnamed, in Ahdia's POV) and the epilogue's 'a woman's voice' (unnamed; her dialogue names Bellatrix in the third person). The ch17 Intermediary never returns on the page — inherited by Book 2, presumed Bellatrix/Geneva, NOT RULED."
    - "Whitford is MINOR, CORRUPT, and an ongoing Book 2 threat. His vanishing after ch17 is scope, not a dropped thread. Tess never faces her father in Book 1."

  character:
    - "Bourn is a WOMAN (she/her) and is OVERSEER ('Director Overseer Bourn'). She is never on the pavement; Colonel Mack commands the ground (ch28–29) and reports by comm."
    - "Ryu MATSUDA. 'Shiba' was drift and appears nowhere in the shipped book."
    - "'Marcus' never appears anywhere in Book 1 (verified 2026-09-02)."
    - "Kain is a DIAMOND MAGNATE and presidential candidate; 'Mayor' was drift."
    - "Victor has NO dead wife. Romantic partner is Leah. BOOK1_FINAL_STATE.md is WRONG on this."
    - "AR-Ryu is Ryu's system (Ahdia did NOT build or name it)."
    - "Isaiah Bennett is an ADULT environmental engineer killed by police (NOT seventeen — that's Korede's age). His death drives the cover-up investigation thread in Book 2."
    - "Ruth and Firas were romantic partners (he was planning to propose — Book 2 reveal)."
    - "Firas's last words: 'Oh hey. I knew you were in there somewhere.' — shipped as “Oh hey,” he said. / “I knew you were in there somewhere.” (ch29). Do not paraphrase."
    - "Ahdia's codename is 'Auerbach' (parents' legacy, assigned by CADENS; Bourn picked it). The epilogue woman says 'Agent Auerbach'."
    - "Tess's translocation is the most FAERIS-executed trigger and the only one that survives the EMP. No character may explain it correctly (§7)."
    - "'Gale' = Ruth (Nightingale shortened, on comms). Not a separate character."

  numbers_and_naming:
    - "AGES: Ahdia TWENTY-SEVEN (both sites: ch14a 'a heart attack at twenty-seven', ch19 'twenty-seven years old'). Firas 25 (derived). Ahdia EIGHT at Montana, Firas SIX (ch2 'eight and six years of their lives, respectively'). The Go Squad is four years old; founded when Firas was 21."
    - "CALENDAR: late September for ch17–30; August 14 (ch13 playback) is the ONLY date in the book; no year anywhere (§8). Warehouse → docks = six weeks; Jericho held six weeks; Ruth at CADENS one day; FAERIS independence three days old at ch20. Never date an event; never count toward November; cold is weather, never season."
    - "DOSES: nine total — dose 1 in ch20, eight in the cabinet; interval three weeks then monthly (§7e). Ch24: seven taken, the eighth palmed. Ch29: the eighth goes in. Ch30 calls the palmed one 'the eighth treatment'."
    - "NAMING FOLLOWS POV (§7g): Ruth's proximity = first names (Ben, Victor, Leah, Tess), even mid-battle; Ahdia's proximity = codenames — until CONTACT: Leah at the shove (ch28), Victor at the backhand (ch28), Ben and Tess inside the chain paragraph (ch29). Night Knight and Gloom Girl never drift in ch28. Ruth and Firas always names. The team's own proximity: codenames on the job, first names off. Kain's POV: codenames; the Tanks by name."
    - "Bourn → Mack where ruled: the ground commander in ch28–29 is Mack; 'Some things are more important than careers, ma'am.' is Mack to Bourn."
    - "REGISTER FOLLOWS POV: Kain's chapters are cold, Ruth-under-threat is dry, ch24 is a dream and a medical emergency — do not run a voice pass to raise comic density in a chapter whose POV character is not funny."

  style_rules_applied_corpus_wide:
    - "COUNTING-AS-INTERIORITY IS BANNED FOR EVERYONE, AHDIA INCLUDED (Director reversed the crew carve-out 2026-08-31: 'Nobody counts. No character exemption exists.'). Survivors are idioms, machines, frozen dialogue, and Ryu's finger-count (the author's own beat)."
    - "The ACCOUNTING-METAPHOR family (arithmetic, ledger, came due, an accounting, the bill, exchange rate) is banned in narration — EXCEPT inside Kain's POV, where it is voice (Director, verbatim: 'When the metaphor system belongs to the character's actual worldview it stops being a tell and becomes voice.')."
    - "The 'X, the way Y verbs' simile frame swept (51 → 7; the seven are the Director's own in ch26). Trailing ', which is/was' clusters thinned. The unlicensed appraisal adverbs (patiently, entirely, visibly, briefly, thoroughly, personally, deliberately, currently...) swept to zero in narration; -ly band is ceiling-only (0–17/1K), no floor. Fix by deletion, never by synonym swap."
    - "ch22 (rebuilt): Tess POV, staging A, three movements, Kain's mispricing on the page, the plinth case cracks, the fight closes on the light changing color. ch9's training paragraph is now two sentences ('the training had no answer in it')."
    - "Dialogue is FROZEN (byte-identical to first_edition_clean/); a Director dialogue edit goes into the source pre-freeze. Rebuild packets reduce a tag to 'said', never drop it."

