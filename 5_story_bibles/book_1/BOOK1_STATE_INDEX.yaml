# BETWEEN BOOKS GAP (Book 1 → Book 2)
# ============================================

between_books:
  time_gap: "6-8 months"
  bridge_to: book_2

  events:
    - id: "isaiah_bennett_killed"
      description: "Isaiah Bennett killed by Officer Webb during routine stop"
      when: "6-8 months before Book 2 Chapter 1"
      consequence: "Sets up Book 2 riot and investigation arcs"
      characters: [isaiah_bennett, officer_webb]
      canon_warning: "Isaiah death is BEFORE Book 2 - not shown on page"

    - id: "ahdia_treatment_success"
      description: "CR-7 Temporal treatment restores Ahdia to ~90% baseline"
      administered_by: [ruth, ryu]
      schedule: "Regular regiment with Ruth and CADENS"
      starting_baseline: "~10% (post-ch29 crisis)"
      ending_baseline: "~90% (stable at Book 2 start)"
      note: "This is why Ahdia can use powers in Book 2 Chapter 1"

    - id: "victor_leah_relationship"
      description: "Victor and Leah become romantic partners"
      characters: [victor, leah]
      note: "Hinted at in Book 1 (flirting), became official during gap"
      book2_status: "established romantic partners"

    - id: "tess_leta_relationship"
      description: "Tess and Leta established as partners"
      characters: [tess, leta]
      note: "Leta is NEW character - not mentioned in Book 1"
      book2_status: "established romantic partners"
      leta_introduction: "First appears Book 2 Chapter 1"

    - id: "go_squad_operations_continue"
      description: "Go Squad continues night patrols under Ruth's leadership"
      coordinator: ruth
      mcc_operator: ahdia
      note: "Team established in new normal post-Firas"

    - id: "kain_mayoral_administration"
      description: "Kain continues as mayor, begins presidential campaign groundwork"
      character: harding_kain
      public_perception: "Hero mayor who survived terrorist attack"
      note: "Clone immortality unknown to public"

