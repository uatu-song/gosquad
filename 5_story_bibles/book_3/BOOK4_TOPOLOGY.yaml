    Powerless Ahdia-5 (Prime burned out her abilities) must survive Bellatrix's
    war — clone avatar armies + embodied Eidolon — while learning to be enough
    without powers. Prime poses as "Aunt Diana" and secretly enhances the team.
    Triple-Layer Deception: team thinks Ahdia is enhancing them; Ahdia knows
