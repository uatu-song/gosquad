    description: >
      Team thinks Ahdia is enhancing them (like Book 1). Ahdia knows it's actually
      Diana. Diana hides her time travel ability. Multiple layers of secrecy
      compound the pressure.
    phases:
      established: "Ch1-8 — Diana's enhancement begins after FAERIS seized"
      pressure: "Close quarters on Exile Island intensify the secrecy"
      reveal: "Ch14 — Ruth learns Diana's true identity"
      collapse: "TBD — when does team learn about Diana? Likely after rescue (Ch50+)"

  iteration_history_revelations:
    description: "Diana progressively reveals what happened in each of the 4 prior timelines (Giver-style)"
    sequence:
      iteration_1: "Implicit baseline (Prime's original) — Geneva assassinated, no utopia"
      iteration_2: "Ch11 — Rational blueprint, Platonic philosopher-queen, 8 years peace, became authoritarian, collapsed in a year"
      iteration_3: "Ch12-13 (proposed) — Piecemeal engineering, almost succeeded ~6 months, Bellatrix reveals as Geneva, collapse; this is Rivets' world"
      iteration_4: "Ch14-15 (proposed) — Human conditioning → dystopian nightmare"
      iteration_5: "Current — no utopia attempt, acceptance"
    canon_warnings:
      - "5 iterations total (master plan references to 43/47 are STALE)"
      - "Geneva = Bellatrix's previous clone avatar (Iteration 3 reveal)"

  faeris_seizure_and_liberation:
    description: "Kain takes FAERIS network → team loses enhancement → Mother freed → FAERIS swarm liberates"
    sequence:
      seizure: "Ch6-7 — Presidential authority seizes CADENS, FAERIS network compromised"
      abandonment: "Ch8 — Drones abandon team mid-fight"
      diana_substitute: "Ch8-onward — Diana secretly enhances instead"
      tess_anomaly: "Tess's drone stays loyal (reason TBD)"
      mother_freed: "Ch44 — Victor wakes Mother with Bourn's protocol"
      swarm_response: "Ch45 — FAERIS city-wide swarm; turn on clone army"

  mother_faeris_liberation_arc:
    description: "From exploited dormant matriarch to freed agent choosing to help"
