      - "B: Keep as single ~50-chapter volume"
      - "C: Defer pending prose length"
    reasoning: "B2 precedent for similar length. Rift at Ch19 = natural break with satisfying cliffhanger. Single volume ~150K words exceeds typical commercial bounds."
    action_required: "If ratified: rename topology to BOOK4A_TOPOLOGY.yaml + BOOK4B_TOPOLOGY.yaml; add book_4b entry to SERIES_TOPOLOGY; series count becomes 9."

  C7_bellatrix_climax_fate:
    severity: MEDIUM
    class: SOFT
    proposed_resolution: "Option A — Allows rescue. Bellatrix stays in The Between, alone. 'Go. Be whole. Be enough.'"
    director_alternatives:
      - "B: Tries to stop, fails (defeated antagonist framing)"
      - "C: Sacrifices for rescue (dies/disappears holding rift open)"
    reasoning: "Cleanest match to v3 maternal-obsession motive. Preserves her as ongoing presence for Books 5-8 without requiring comeback arc. Option B undercuts v3 by treating her as defeated. Option C creates closure that may foreclose later arc."
    action_required: "If ratified: flag her as 'in The Between, alone' for Book 5 inheritance."

  C8_eidolon_climax_fate:
    severity: MEDIUM
    class: SOFT
    proposed_resolution: "Survives, freed (connection to Bellatrix severed by Mother FAERIS), wanders fragmented. Sets up Books 5-8 reunification arc."
    director_alternatives:
      - "B: Dies (clone husk collapses with FAERIS counterattack)"
      - "C: Flees (escapes to dimensional fold, future antagonist)"
      - "D: Redemption begun (active ally by Book 5)"
    reasoning: "Eidolon-as-fragment-victim (per C3) benefits from survival to enable the Hope/Joy/Rage/Grief/Love reunification quest. 'Wandering' leaves maximum optionality for Book 5."
    action_required: "If ratified: lock survival, connection severed, fate as 'wandering, fragmented' for B5 inheritance."

  C9_kain_climax_fate:
    severity: MEDIUM
    class: SOFT
    proposed_resolution: "Fled, still in power, weakened but unkillable individually. Remains President; CADENS crippled; clone system intact."
    director_alternatives:
      - "B: Captured (public trial Book 5)"
      - "C: Killed — one clone (another takes over)"
      - "D: Deposed (counter-coup removes him)"
    reasoning: "Consistent with B2B locked endpoint (unkillable individually). Preserves him as ongoing institutional threat — series' CBT critique is partly about institutions outlasting individuals. B/D create premature closure."
    action_required: "If ratified: lock Kain still in office; CADENS crippled; clones down 1-2 but system intact."

  C10_tess_faeris_mystery:
    severity: LOW
    class: SOFT
    proposed_resolution: "Mid-Book 4 reveal at Ch22 ('Loyal'). Tess's FAERIS bonded via quantum entanglement formed during her teleportation training — which used Ahdia's temporal abilities. The bond carries an Ahdia-signature the FAERIS preserves."
    director_alternatives:
      - "B: Hold mystery for Book 5"
      - "C: Earlier reveal — Ch10 when Tess uses it to track Ahdia"
      - "D: Different mechanism (Director rewrites)"
    reasoning: "Ch22 'Loyal' already planned as Tess's solo chapter exploring this question. Holding longer risks audience forgetting the question matters."
    action_required: "If ratified: lock Ch22 reveal; confirm quantum-bond-via-Ahdia mechanism."

  C11_pio_survival:
    severity: LOW
    class: SOFT
    proposed_resolution: "Pio survives extraction, severely damaged. Repaired by team over Books 5-8. Iteration-3 tech becomes series asset."
    director_alternatives:
      - "B: Pio stays in The Between (Rivets had to abandon her); ongoing grief"
      - "C: Pio destroyed in extraction (Rivets loses everything twice)"
    reasoning: "Pio is Rivets' emotional anchor (parallel to AR-Ryu). Losing her twice removes Rivets' remaining anchor going into B5. Bringing her through gives forward action (repair) and a useful series asset."
    action_required: "If ratified: lock Pio survives the rift; flag repair-over-B5 as Rivets' character work."

  C12_team_diana_reveal:
    severity: MEDIUM
    class: SOFT
    proposed_resolution: "Late Book 4B during rescue mission (Ch46-48). When Diana coordinates artificial sun activation and team sees her using temporal powers openly, the cover collapses."
    director_alternatives:
      - "B: During Exile Island close quarters (Ch10+)"
      - "C: Climax aftermath (Ch50-51, calm)"
      - "D: Carries into Book 5"
    reasoning: "Operational necessity is the natural breaking point. Preserves Exile Island tension without forcing premature reveal. Climax aftermath too late. B5 carryover lets lie metastasize unnecessarily."
    action_required: "If ratified: lock late-B4B reveal during rescue mission coordination."

