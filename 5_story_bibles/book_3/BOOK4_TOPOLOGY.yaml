  chess_scaffold:
    selected: false
    note: "Not yet selected. Chess game TBD per planning status doc."
  cbt_failing_role: >
    Book 4 is the FINAL CBT failure. Confidence ('I can do this without powers'
    + 'evidence + truth + heroism work') collapses when confronted with
    incomprehensible challenge. Ahdia's breakdown is necessary to enable Book 5's
    DBT turning point.

