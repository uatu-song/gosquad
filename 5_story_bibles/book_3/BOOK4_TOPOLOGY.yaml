      chapters: "Ch20-51 (proposed)"
      arc: "Scattered survival → guerrilla resistance → rescue mission → climax"
      end_state: "Clone army defeated; Mother FAERIS freed; Ahdia rescued; team reunited (minus AR-Ryu); Captain Rivets joins"
    compression_needed:
      note: "Per root CLAUDE.md, Act 1 needs compression so the rift lands at true midpoint"
      current: "Act 1 = 7-19 confidence chapters depending on count method"
      target: "4-5 chapters before rift in 4A"

  locked_endpoints:
